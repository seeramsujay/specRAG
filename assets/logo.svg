<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Chip & Circuit Gradient -->
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- RAG Search Ray Gradient -->
    <linearGradient id="rag-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- PCB Circuit Trace Grid -->
  <g opacity="0.18" stroke="#06B6D4" stroke-width="2" fill="none">
    <path d="M 120 200 L 220 200 L 260 240 L 260 320" />
    <path d="M 120 280 L 180 280 L 220 320 L 260 320" />
    <path d="M 120 520 L 200 520 L 260 460" />
    <path d="M 120 600 L 240 600 L 280 560 L 280 480" />

    <path d="M 680 200 L 580 200 L 540 240 L 540 320" />
    <path d="M 680 280 L 620 280 L 580 320 L 540 320" />
    <path d="M 680 520 L 600 520 L 540 460" />
    <path d="M 680 600 L 560 600 L 520 560 L 520 480" />
  </g>

  <!-- IC Chip Body (Central Grounding) -->
  <rect x="270" y="250" width="260" height="260" rx="28" fill="#111827" stroke="url(#chip-grad)" stroke-width="8" filter="url(#glow)" />

  <!-- IC External Pins -->
  <!-- Top Pins -->
  <g stroke="#38BDF8" stroke-width="6" stroke-linecap="round">
    <line x1="320" y1="210" x2="320" y2="250" />
    <line x1="370" y1="210" x2="370" y2="250" />
    <line x1="430" y1="210" x2="430" y2="250" />
    <line x1="480" y1="210" x2="480" y2="250" />
    <!-- Bottom Pins -->
    <line x1="320" y1="510" x2="320" y2="550" />
    <line x1="370" y1="510" x2="370" y2="550" />
    <line x1="430" y1="510" x2="430" y2="550" />
    <line x1="480" y1="510" x2="480" y2="550" />
    <!-- Left Pins -->
    <line x1="230" y1="300" x2="270" y2="300" />
    <line x1="230" y1="350" x2="270" y2="350" />
    <line x1="230" y1="410" x2="270" y2="410" />
    <line x1="230" y1="460" x2="270" y2="460" />
    <!-- Right Pins -->
    <line x1="530" y1="300" x2="570" y2="300" />
    <line x1="530" y1="350" x2="570" y2="350" />
    <line x1="530" y1="410" x2="570" y2="410" />
    <line x1="530" y1="460" x2="570" y2="460" />
  </g>

  <!-- Vector RAG Ingestion / Datasheet Lens Beam -->
  <polygon points="400,380 580,240 640,440" fill="url(#rag-beam)" />

  <!-- Central Retrieval Matrix / Vector Geometry inside IC -->
  <g fill="none" stroke="#22D3EE" stroke-width="2.5" filter="url(#subtle-glow)">
    <polygon points="400,300 470,350 440,430 360,430 330,350" />
    <line x1="400" y1="300" x2="440" y2="430" />
    <line x1="400" y1="300" x2="360" y2="430" />
    <line x1="470" y1="350" x2="330" y2="350" />
  </g>

  <!-- Neural Vector Nodes (Datasheet Embeddings) -->
  <g fill="#10B981" filter="url(#subtle-glow)">
    <circle cx="400" cy="300" r="6" />
    <circle cx="470" cy="350" r="6" />
    <circle cx="440" cy="430" r="6" />
    <circle cx="360" cy="430" r="6" />
    <circle cx="330" cy="350" r="6" />
    <circle cx="400" cy="380" r="8" fill="#F8FAFC" stroke="#06B6D4" stroke-width="3" />
  </g>

  <!-- Typography -->
  <text x="400" y="675" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    SPEC<tspan fill="#38BDF8">RAG</tspan>
  </text>
  <text x="400" y="712" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    FIRMWARE SPECIFICATION RAG &amp; MCP AUDITOR
  </text>
</svg>
